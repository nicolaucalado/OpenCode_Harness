[project]
name = "opencode-harness"
version = "0.1.0"
description = "Harness de desenvolvimento com OpenCode para o bootcamp Santander — Dados com Python e IA (DIO)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "numpy>=2.0",
  "pandas>=2.2",
]

[dependency-groups]
dev = [
  "ipykernel>=6.29",
  "matplotlib>=3.9",
  "nbformat>=5.10",
  "pytest>=8.3",
  "ruff>=0.9",
  "scikit-learn>=1.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/opencode_harness"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "PD", "RUF"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"

[tool.ruff.lint.per-file-ignores]
# Notebooks preparam imports para células posteriores; F401 não faz sentido lá.
"*.ipynb" = ["F401"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
