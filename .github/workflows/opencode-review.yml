name: opencode · revisão de PR

# Revisão automática usando o caminho documentado no OpenCode V2:
#   opencode run --standalone  (ver https://opencode.ai/v2/docs/cli/commands)
# Atenção: a documentação cita --archived, mas o CLI 2.2.5 ainda não aceita essa flag
# (o parser devolve o texto de ajuda). Ver docs/FACT-CHECK.md.
# O resultado é publicado como comentário único no PR (atualizado a cada push).

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  # Comentário de PR passa pela API de issues; sem `issues: write` o gh recebe 403.
  issues: write
  pull-requests: write

concurrency:
  group: opencode-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  # Defina as variables do repositório (Settings > Variables) para trocar de modelo.
  # Primário: Gemini 3.8 Flash (1M de contexto, free tier). Ver docs/PROVIDERS.md.
  MODEL: ${{ vars.OPENCODE_MODEL || 'google/gemini-3.8-flash' }}
  # 1º fallback: outro Gemini, para quando o primário estiver em "high demand".
  MODEL_FALLBACK: ${{ vars.OPENCODE_MODEL_FALLBACK || 'google/gemini-3-flash-preview' }}
  # 2º fallback: Gemini Lite, que tem cota separada dos outros dois. A Groq free foi
  # removida da cadeia: o custo fixo do CLI (~8k tokens) já estoura o TPM de 8.000.
  MODEL_FALLBACK2: ${{ vars.OPENCODE_MODEL_FALLBACK2 || 'google/gemini-3.1-flash-lite-preview' }}
  OPENCODE_VERSION: "2.2.5"
  # Medido no PR #3: diff de 15 KB pediu 13.473 tokens (limite Groq: 8.000 TPM), porque
  # o CLI envia também system prompt, AGENTS.md e definições de ferramentas.
  MAX_DIFF_BYTES: "80000"
  # Só vale para quem escolher um modelo `groq/*`: o free tier não cabe nem com diff zero.
  SMALL_DIFF_BYTES: "3000"

jobs:
  review:
    # PRs de fork não recebem secrets; pular evita job vermelho sem revisão.
    if: >-
      github.event.pull_request.draft == false &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Instalar OpenCode CLI
        run: npm install --global "@opencode/cli@${OPENCODE_VERSION}"

      - name: Gerar diff do PR
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          git diff --no-color --stat "$BASE_SHA"...HEAD > pr-stat.txt
          git diff --no-color "$BASE_SHA"...HEAD > pr-diff-full.txt

          truncar() {
            arquivo="$1"
            limite="$2"
            if [ "$(wc -c < "$arquivo")" -gt "$limite" ]; then
              head -c "$limite" "$arquivo" > "$arquivo.tmp"
              mv "$arquivo.tmp" "$arquivo"
              printf '\n\n[ATENÇÃO: diff truncado em %s de %s bytes pelo workflow; comente o que ficou de fora]\n' \
                "$limite" "$(wc -c < pr-diff-full.txt)" >> "$arquivo"
            fi
          }

          cp pr-diff-full.txt pr.diff          # modelos com contexto grande (Gemini)
          cp pr-diff-full.txt pr-small.diff    # modelos com TPM baixo (Groq free)
          truncar pr.diff "$MAX_DIFF_BYTES"
          truncar pr-small.diff "$SMALL_DIFF_BYTES"

          echo "Tamanho do diff: $(wc -c < pr-diff-full.txt) bytes (original)"
          echo "Arquivos alterados:" && cat pr-stat.txt

      - name: Verificar credencial
        id: creds
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          if [ -n "${GROQ_API_KEY}${GEMINI_API_KEY}${ANTHROPIC_API_KEY}${OPENAI_API_KEY}${OPENCODE_API_KEY}${OPENROUTER_API_KEY}" ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Nenhuma API key configurada. Veja docs/SETUP.md (secrets)."
          fi

      - name: Revisar com OpenCode
        id: review
        if: steps.creds.outputs.ok == 'true'
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          set -o pipefail

          PROMPT=$(cat <<'EOF'
          Você é o revisor automático deste repositório. Analise o diff do pull request anexado.

          Regras:
          - Responda em português do Brasil, em Markdown, com no máximo 600 palavras.
          - Apenas revise: não edite arquivos, não faça commits, não comente no GitHub.
          - Leia o arquivo completo quando o diff não bastar para entender o contexto.
          - Cite sempre caminho/arquivo:linha.
          - Classifique cada achado como [bloqueante], [importante] ou [sugestão].
          - Verifique: erro de lógica, caso de borda, vazamento de dados (treino/teste),
            aleatoriedade sem seed, segredo em código, dependência desnecessária,
            falta de teste e notebook com saída gigante.
          - Aponte o que precisa mudar, sem elogios e sem resumo genérico.
          - Se o diff estiver truncado (aviso no final), diga que a análise é parcial.
          - Se não houver achado relevante, diga isso em uma linha.
          EOF
          )

          diff_para() {
            case "$1" in
              groq/*) echo pr-small.diff ;;
              *) echo pr.diff ;;
            esac
          }

          revisar() {
            modelo="$1"
            arquivo=$(diff_para "$modelo")
            : > review.md
            : > review.err
            # Estado isolado por tentativa: sem isso o fallback herda a sessão anterior
            # (e o contexto cresce até estourar o TPM do provider).
            estado=$(mktemp -d)
            mkdir -p "$estado/data" "$estado/state" "$estado/cache"
            echo "Tentando $modelo com $arquivo ($(wc -c < "$arquivo") bytes)"
            if ! XDG_DATA_HOME="$estado/data" XDG_STATE_HOME="$estado/state" \
              XDG_CACHE_HOME="$estado/cache" \
              timeout 240 opencode run --standalone --model "$modelo" \
              --file pr-stat.txt --file "$arquivo" "$PROMPT" > review.md 2> review.err; then
              echo "::warning::opencode falhou com $modelo"
              sed -n '1,30p' review.err
              rm -rf "$estado"
              return 1
            fi
            if [ ! -s review.md ]; then
              rm -rf "$estado"
              return 1
            fi
            # Com flag inválida o CLI imprime o help em vez de revisar; isso não é revisão.
            if grep -qE 'opencode run \[flags\]|^USAGE$' review.md; then
              echo "::error::O CLI devolveu o texto de ajuda em vez de revisar (flag inválida?)"
              rm -rf "$estado"
              return 1
            fi
            rm -rf "$estado"
            echo "$modelo" > modelo-usado.txt
            return 0
          }

          for modelo in "$MODEL" "$MODEL_FALLBACK" "$MODEL_FALLBACK2"; do
            [ -n "$modelo" ] || continue
            if revisar "$modelo"; then
              echo "::notice::Revisão gerada com $modelo"
              break
            fi
            echo "::warning::Falha com $modelo"
            rm -f review.md review.err
          done

          if [ ! -s review.md ]; then
            echo "::error::Nenhum modelo produziu revisão (cadeia inteira falhou)"
            exit 1
          fi

          echo "--- saída do modelo ---"
          cat review.md
          if [ -s review.err ]; then echo "--- stderr ---"; cat review.err; fi

      - name: Publicar comentário
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          modelo_usado=$(cat modelo-usado.txt 2>/dev/null || echo "$MODEL")
          if [ ! -s review.md ]; then
            printf '⚠️ A revisão automática não produziu saída para `%s`. Veja os logs do job (Actions) e se o secret do provider está configurado.\n' "$MODEL" > review.md
          fi

          {
            echo '<!-- opencode-review -->'
            echo '## Revisão automática — OpenCode'
            echo
            printf '_Modelo: `%s` · commit: `%s`_\n\n' "$modelo_usado" "${HEAD_SHA:0:7}"
            echo
            cat review.md
            echo
            echo '<sub>Gerado por IA; verifique antes de aplicar. Para pedir mudanças, use <b>Actions → opencode · tarefa</b>.</sub>'
          } > body.md

          comment_id=$(gh api --paginate "repos/${REPO}/issues/${PR}/comments" \
            --jq '.[] | select(.body | contains("<!-- opencode-review -->")) | .id' | tail -n 1)

          if [ -n "$comment_id" ]; then
            gh api --method PATCH "repos/${REPO}/issues/comments/${comment_id}" -F body=@body.md > /dev/null
            echo "Comentário atualizado: $comment_id"
          else
            gh api --method POST "repos/${REPO}/issues/${PR}/comments" -F body=@body.md > /dev/null
            echo "Comentário criado."
          fi
